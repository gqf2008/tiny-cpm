# burn spike 2: Qwen3-TTS-12Hz-1.7B core path (talker + code predictor + Mimi
# codec decoder) on burn 0.22.0-pre.1 Metal. Build with a shared target dir to
# reuse the burn/wgpu compile cache:
#   CARGO_TARGET_DIR=../target-shared cargo build --release
[package]
name = "burn-tts-spike"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
# burn's kernel-fusion engine (mlx-style graph fusion). The Q4_K custom-kernel
# path is incompatible with fusion primitives (FusionTensor has no raw buffer
# handle), so --talker-quant/--qmat-test are disabled under this feature.
fusion = ["burn/fusion", "burn-wgpu/fusion"]

[dependencies]
anyhow = "1"
burn = { path = "../../burn/crates/burn", default-features = false, features = ["metal", "std"] }
hound = "3.5"
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "wav"] }
realfft = "3"
cubecl = { git = "https://github.com/tracel-ai/cubecl", rev = "be278a1e76aed881e2cc6b165414ee6103ca4634", features = ["wgpu", "stdlib"] }
cubecl-common = { git = "https://github.com/tracel-ai/cubecl", rev = "be278a1e76aed881e2cc6b165414ee6103ca4634" }
burn-wgpu = { path = "../../burn/crates/burn-wgpu", default-features = false, features = ["metal", "std"] }
burn-backend = { path = "../../burn/crates/burn-backend" }
burn-tensor = { path = "../../burn/crates/burn-tensor", default-features = false, features = ["std", "extension"] }
tokenizers = "0.22"

# Local cubecl fork (bind-group caching). Clone of tracel-ai/cubecl at be278a1e…
[patch."https://github.com/tracel-ai/cubecl"]
cubecl = { path = "../../cubecl/crates/cubecl" }
cubecl-common = { path = "../../cubecl/crates/cubecl-common" }
cubecl-core = { path = "../../cubecl/crates/cubecl-core" }
cubecl-cpp = { path = "../../cubecl/crates/cubecl-cpp" }
cubecl-cpu = { path = "../../cubecl/crates/cubecl-cpu" }
cubecl-cuda = { path = "../../cubecl/crates/cubecl-cuda" }
cubecl-environment = { path = "../../cubecl/crates/cubecl-environment" }
cubecl-hip = { path = "../../cubecl/crates/cubecl-hip" }
cubecl-ir = { path = "../../cubecl/crates/cubecl-ir" }
cubecl-macros = { path = "../../cubecl/crates/cubecl-macros" }
cubecl-opt = { path = "../../cubecl/crates/cubecl-opt" }
cubecl-runtime = { path = "../../cubecl/crates/cubecl-runtime" }
cubecl-std = { path = "../../cubecl/crates/cubecl-std" }
cubecl-wgpu = { path = "../../cubecl/crates/cubecl-wgpu" }
cubecl-zspace = { path = "../../cubecl/crates/cubecl-zspace" }
