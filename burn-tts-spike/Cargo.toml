# burn spike 2: Qwen3-TTS-12Hz-1.7B core path (talker + code predictor + Mimi
# codec decoder) on burn 0.22.0-pre.1 Metal. Build with a shared target dir to
# reuse the burn/wgpu compile cache:
#   CARGO_TARGET_DIR=../target-shared cargo build --release
[package]
name = "burn-tts-spike"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1"
burn = { path = "../../burn/crates/burn", default-features = false, features = ["metal", "std"] }
hound = "3.5"
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "wav"] }
realfft = "3"
cubecl = { git = "https://github.com/tracel-ai/cubecl", rev = "be278a1e76aed881e2cc6b165414ee6103ca4634", features = ["wgpu", "stdlib"] }
cubecl-common = { git = "https://github.com/tracel-ai/cubecl", rev = "be278a1e76aed881e2cc6b165414ee6103ca4634" }
burn-wgpu = { path = "../../burn/crates/burn-wgpu", default-features = false, features = ["metal", "std"] }
burn-backend = { path = "../../burn/crates/burn-backend" }
burn-tensor = { path = "../../burn/crates/burn-tensor", default-features = false, features = ["std", "extension"] }
tokenizers = "0.22"
