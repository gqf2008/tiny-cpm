<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>tiny-cpm voice</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e;
         --accent: #2f81f7; --bubble-user: #1f6feb; --bubble-ai: #21262d; --green: #3fb950; --red: #f85149; }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text);
         height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* top bar */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel);
            border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .topbar .logo { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .topbar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background .3s; }
  .topbar .dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .topbar .dot.reconnect { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .topbar .status { font-size: 12px; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar button { background: var(--border); color: var(--text); border: none; padding: 5px 14px;
                   border-radius: 6px; cursor: pointer; font-size: 13px; }
  .topbar button:hover { background: #3d444d; }
  .topbar .gear { background: transparent; font-size: 18px; padding: 2px 6px; border-radius: 4px; }

  /* mic button (floating, right side) */
  .mic-btn { position: fixed; right: 20px; bottom: 72px; width: 56px; height: 56px; border-radius: 50%;
             border: none; cursor: pointer; font-size: 22px; z-index: 100;
             background: var(--border); color: var(--text); display: flex; align-items: center; justify-content: center;
             transition: all .2s; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .mic-btn:hover { background: #3d444d; transform: scale(1.05); }
  .mic-btn.on { background: var(--red); color: #fff; }
  .mic-btn.on::after { content: ''; position: absolute; inset: -4px; border-radius: 50%;
                        border: 2px solid var(--red); opacity: 0; animation: ring 1.5s infinite; }
  @keyframes ring { 0%{opacity:.6;transform:scale(1)} 100%{opacity:0;transform:scale(1.6)} }
  .mic-btn .lvl { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
                  width: 40px; height: 3px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .mic-btn .lvl > div { height: 100%; width: 0; background: var(--green); transition: width .05s; }

  /* settings drawer */
  .drawer { background: var(--panel); border-bottom: 1px solid var(--border); padding: 0 16px;
            max-height: 0; overflow: hidden; transition: max-height .3s ease; flex-shrink: 0; }
  .drawer.open { max-height: 500px; padding: 12px 16px; overflow-y: auto; }
  .drawer h3 { font-size: 11px; color: var(--muted); margin: 8px 0 4px; text-transform: uppercase; letter-spacing: .5px; }
  .drawer .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .drawer label { font-size: 12px; color: var(--muted); width: 140px; font-family: ui-monospace, monospace; }
  .drawer input[type=range] { flex: 1; }
  .drawer .val { font-size: 12px; color: var(--accent); width: 44px; text-align: right; font-family: ui-monospace, monospace; }
  .drawer textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
                     border-radius: 6px; padding: 8px; font: inherit; resize: vertical; }
  .drawer .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* chat */
  .chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .chat::-webkit-scrollbar { width: 6px; } .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; word-wrap: break-word; white-space: pre-wrap; line-height: 1.45; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--bubble-ai); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; font-size: 12px; color: var(--muted); background: none; padding: 2px; }
  .msg.ai.streaming::after { content: '▌'; opacity: .5; animation: blink .8s infinite; }
  @keyframes blink { 50%{opacity:0} }

  /* input */
  .inputbar { display: flex; gap: 8px; padding: 10px 16px; background: var(--panel);
              border-top: 1px solid var(--border); flex-shrink: 0; }
  .inputbar input { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
                     border-radius: 20px; padding: 9px 16px; font: inherit; outline: none; }
  .inputbar input:focus { border-color: var(--accent); }
  .inputbar button { background: var(--accent); color: #fff; border: none; padding: 9px 18px;
                     border-radius: 20px; cursor: pointer; font: inherit; }
  .inputbar button:disabled { opacity: .3; }
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">🔊 tiny-cpm</span>
  <div class="dot" id="dot"></div>
  <span class="status" id="status">连接中…</span>
  <button class="gear" id="gear" title="设置">⚙</button>
</div>

<div class="drawer" id="drawer">
  <h3>人设 / Persona</h3>
  <textarea id="persona" placeholder="留空=默认助手。例：你是毒舌但热心的技术顾问" rows="2"></textarea>
  <h3>麦克风</h3>
  <div class="row"><label>mic gain</label><input type="range" id="micGain" min="1" max="16" step="0.5" value="1"><span class="val" id="micGainV">1.0</span></div>
  <div class="row"><label>rms gate</label><input type="range" id="rmsGateSlider" min="0" max="0.1" step="0.002" value="0.012"><span class="val" id="rmsGateV">0.012</span></div>
  <div class="hint">RMS: <span id="rmsVal">0.0000</span></div>
  <h3>server_vad</h3>
  <div class="row"><label>threshold</label><input type="range" id="threshold" min="0.1" max="0.9" step="0.05" value="0.5"><span class="val" id="threshold_v">0.5</span></div>
  <div class="row"><label>silence_ms</label><input type="range" id="silence" min="200" max="6000" step="100" value="800"><span class="val" id="silence_v">800</span></div>
  <div class="row"><label>max_history</label><input type="range" id="hist" min="1" max="50" step="1" value="20"><span class="val" id="hist_v">20</span></div>
</div>

<div class="chat" id="chat"></div>

<button class="mic-btn" id="micBtn" title="点击开关麦克风">🎤<div class="lvl"><div></div></div></button>

<div class="inputbar">
  <input id="textInput" placeholder="打字回车发送…（语音点右下麦克风）" disabled>
  <button id="sendText" disabled>发送</button>
</div>

<script>
const wsUrl = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws';
const IN_SR = 16000, OUT_SR = 24000;
let ws = null, ctx = null, micStream = null, recNode = null, playNode = null;
let micOn = false, micGain = 1.0, rmsGate = 0.012;
let responding = false, replyBuf = '', replyEl = null, playbackStarted = false;
const playBuf = [];
let reconnectDelay = 1000;  // exponential backoff
let reconnectTimer = null;

const $ = id => document.getElementById(id);
const setStatus = (s, cls) => { $('status').textContent = s; const dot = $('dot'); dot.className = 'dot' + (cls ? ' '+cls : ''); };
const addMsg = (cls, txt) => { const d = document.createElement('div'); d.className = 'msg '+cls; d.textContent = txt; $('chat').appendChild(d); $('chat').scrollTop = $('chat').scrollHeight; return d; };

// ── WebSocket connect with auto-reconnect ──
function connect() {
  setStatus('连接中…', 'reconnect');
  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { reconnectDelay = 1000; setStatus('已连接', 'live'); ws.send(JSON.stringify(buildSession())); enableInput(true); };
  ws.onmessage = onMessage;
  ws.onclose = () => { setStatus('断开，重连中…', 'reconnect'); enableInput(false); micOff(); scheduleReconnect(); };
  ws.onerror = () => { ws.close(); };
}
function scheduleReconnect() {
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(() => { connect(); }, reconnectDelay);
  reconnectDelay = Math.min(reconnectDelay * 2, 10000);  // backoff up to 10s
}
function enableInput(on) {
  $('textInput').disabled = !on; $('sendText').disabled = !on;
}

// ── Server events ──
function onMessage(ev) {
  const m = JSON.parse(ev.data);
  switch (m.type) {
    case 'session.created': case 'session.updated': break;
    case 'input_audio_buffer.speech_started':
      if (responding) { playBuf.length = 0; playbackStarted = false; } break;
    case 'input_audio_buffer.speech_stopped': break;
    case 'conversation.item.input_audio_transcription.completed':
      addMsg('user', m.transcript); break;
    case 'response.created': responding = true; setStatus('思考中…', 'live'); break;
    case 'response.audio_transcript.delta':
      if (m.delta) { replyBuf += m.delta;
        if (!replyEl) { replyEl = addMsg('ai', replyBuf); replyEl.classList.add('streaming'); }
        else { replyEl.textContent = replyBuf; }
        $('chat').scrollTop = $('chat').scrollHeight; setStatus('回复中…', 'live'); }
      break;
    case 'response.audio.delta':
      if (m.delta) { const raw = atob(m.delta); const a = new Uint8Array(raw.length); for (let i=0;i<raw.length;i++) a[i]=raw.charCodeAt(i); const i16 = new Int16Array(a.buffer); const f = new Float32Array(i16.length); for (let i=0;i<i16.length;i++) f[i]=i16[i]/32768; playBuf.push(f); }
      break;
    case 'response.done':
      if (replyEl) replyEl.classList.remove('streaming');
      responding = false; replyBuf = ''; replyEl = null; playbackStarted = false;
      setStatus(micOn ? '监听中' : '已连接', 'live'); break;
    case 'error': addMsg('sys', '⚠ ' + (m.error?.message || '')); break;
  }
}

// ── Audio: mic capture + TTS playback ──
async function micOn_() {
  if (micOn) return;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }, video: false
    });
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: OUT_SR });
    const src = ctx.createMediaStreamSource(micStream);
    const meter = $('micBtn').querySelector('.lvl > div');
    recNode = ctx.createScriptProcessor(4096, 1, 1);
    recNode.onaudioprocess = e => {
      e.outputBuffer.getChannelData(0).fill(0);
      const in0 = e.inputBuffer.getChannelData(0);
      let s = 0; for (let i = 0; i < in0.length; i++) s += in0[i]*in0[i];
      const r = Math.sqrt(s / in0.length);
      meter.style.width = Math.min(100, r*300)+'%'; $('rmsVal').textContent = r.toFixed(4);
      if (!ws || ws.readyState !== 1) return;
      if (r < rmsGate) return;
      const ratio = ctx.sampleRate / IN_SR;
      const outLen = Math.floor(in0.length / ratio);
      const out = new Int16Array(outLen);
      for (let i = 0; i < outLen; i++) {
        const idx = i*ratio, i0 = Math.floor(idx), i1 = Math.min(i0+1, in0.length-1);
        const v = (in0[i0]*(1-(idx-i0)) + in0[i1]*(idx-i0)) * micGain;
        out[i] = Math.max(-32768, Math.min(32767, v*32767));
      }
      const bytes = new Uint8Array(out.buffer);
      let bin = ''; for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      ws.send(JSON.stringify({ type:'input_audio_buffer.append', audio: btoa(bin) }));
    };
    src.connect(recNode); recNode.connect(ctx.destination);
    // playback node (create once)
    if (!playNode) {
      playNode = ctx.createScriptProcessor(8192, 0, 1);
      playNode.onaudioprocess = e => {
        const L = e.outputBuffer.getChannelData(0);
        const total = playBuf.reduce((n,c)=>n+c.length,0);
        if (!playbackStarted && total < OUT_SR*0.3) { L.fill(0); return; }
        playbackStarted = true;
        for (let i = 0; i < L.length; i++) L[i] = shiftOne();
      };
      playNode.connect(ctx.destination);
    }
    micOn = true;
    $('micBtn').classList.add('on');
    setStatus('监听中', 'live');
  } catch (e) { addMsg('sys', '⚠ 麦克风权限被拒绝'); }
}
function micOff() {
  if (!micOn) return;
  micOn = false;
  $('micBtn').classList.remove('on');
  if (recNode) { recNode.disconnect(); recNode = null; }
  if (micStream) { micStream.getTracks().forEach(t=>t.stop()); micStream = null; }
  $('micBtn').querySelector('.lvl > div').style.width = '0';
  if (ws && ws.readyState === 1) setStatus('已连接', 'live');
}
$('micBtn').onclick = () => micOn ? micOff() : micOn_();

// ── Settings ──
$('gear').onclick = () => $('drawer').classList.toggle('open');
function buildSession() {
  return { type:'session.update', session: {
    instructions: $('persona').value || null,
    input_audio_format:'pcm', output_audio_format:'pcm',
    turn_detection: { type:'server_vad', threshold: parseFloat($('threshold').value), silence_duration_ms: parseInt($('silence').value) },
    max_history_turns: parseInt($('hist').value),
  }};
}
$('micGain').oninput = e => { micGain = parseFloat(e.target.value); $('micGainV').textContent = micGain.toFixed(1); };
$('rmsGateSlider').oninput = e => { rmsGate = parseFloat(e.target.value); $('rmsGateV').textContent = rmsGate.toFixed(3); };
for (const [id, lab] of [['threshold','threshold_v'],['silence','silence_v'],['hist','hist_v']]) {
  $(id).oninput = e => { $(lab).textContent = e.target.value; };
  $(id).onchange = () => ws && ws.readyState === 1 && ws.send(JSON.stringify(buildSession()));
}
$('persona').onchange = () => ws && ws.readyState === 1 && ws.send(JSON.stringify(buildSession()));

// ── Text input ──
function sendText() {
  const v = $('textInput').value.trim();
  if (!v || !ws || ws.readyState !== 1) return;
  addMsg('user', v);
  ws.send(JSON.stringify({ type:'conversation.item.create', item:{ type:'message', role:'user', content:[{type:'input_text',text:v}] } }));
  ws.send(JSON.stringify({ type:'response.create' }));
  $('textInput').value = '';
}
$('sendText').onclick = sendText;
$('textInput').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } };

function shiftOne() {
  while (playBuf.length && playBuf[0].length === 0) playBuf.shift();
  if (!playBuf.length) return 0;
  const c = playBuf[0]; const v = c[0];
  if (c.length > 1) playBuf[0] = c.subarray(1); else playBuf.shift();
  return v;
}

// ── Boot: auto-connect on page load ──
connect();
</script>
</body>
</html>
