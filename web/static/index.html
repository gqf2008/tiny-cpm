<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>tiny-cpm voice</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e;
         --accent: #2f81f7; --bubble-user: #1f6feb; --bubble-ai: #21262d; --green: #3fb950; }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text);
         height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  /* top bar */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--panel);
            border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .topbar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .topbar .dot.on { background: var(--green); }
  .topbar .status { font-size: 13px; color: var(--muted); flex: 1; }
  .topbar button { background: var(--border); color: var(--text); border: none; padding: 5px 14px;
                   border-radius: 6px; cursor: pointer; font-size: 13px; }
  .topbar button:hover { background: #3d444d; }
  .topbar button:disabled { opacity: .35; cursor: default; }
  .topbar .gear { background: transparent; font-size: 18px; padding: 2px 6px; }
  /* settings drawer */
  .drawer { background: var(--panel); border-bottom: 1px solid var(--border); padding: 0 16px;
            max-height: 0; overflow: hidden; transition: max-height .3s, padding .3s; flex-shrink: 0; }
  .drawer.open { max-height: 400px; padding: 12px 16px; overflow-y: auto; }
  .drawer h3 { font-size: 12px; color: var(--muted); margin: 8px 0 4px; text-transform: uppercase; letter-spacing: .5px; }
  .drawer .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .drawer label { font-size: 12px; color: var(--muted); width: 150px; font-family: ui-monospace, monospace; }
  .drawer input[type=range] { flex: 1; }
  .drawer .val { font-size: 12px; color: var(--accent); width: 40px; text-align: right; font-family: ui-monospace, monospace; }
  .drawer textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
                     border-radius: 6px; padding: 8px; font: inherit; resize: vertical; }
  .drawer .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
  #micMeter { width: 100%; height: 6px; background: var(--border); border-radius: 3px; margin-top: 4px; }
  #micMeter > div { height: 100%; width: 0; background: var(--green); border-radius: 3px; transition: width .05s; }
  /* chat area */
  .chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; word-wrap: break-word; white-space: pre-wrap; line-height: 1.4; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--bubble-ai); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; font-size: 12px; color: var(--muted); background: none; padding: 2px; }
  /* input bar */
  .inputbar { display: flex; gap: 8px; padding: 10px 16px; background: var(--panel);
              border-top: 1px solid var(--border); flex-shrink: 0; }
  .inputbar input { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
                     border-radius: 20px; padding: 8px 16px; font: inherit; outline: none; }
  .inputbar input:focus { border-color: var(--accent); }
  .inputbar button { background: var(--accent); color: #fff; border: none; padding: 8px 18px;
                     border-radius: 20px; cursor: pointer; font: inherit; }
  .inputbar button:disabled { opacity: .35; }
</style>
</head>
<body>

<div class="topbar">
  <div class="dot" id="dot"></div>
  <span class="status" id="status">未连接</span>
  <button id="start">🎤 开始</button>
  <button id="muteMic" disabled>静音</button>
  <button id="stop" disabled>停止</button>
  <button class="gear" id="gear">⚙</button>
</div>

<div class="drawer" id="drawer">
  <h3>人设 / Persona</h3>
  <textarea id="persona" placeholder="留空=默认助手。例：你是毒舌但热心的技术顾问" rows="2"></textarea>
  <h3>麦克风</h3>
  <div class="row"><label>mic gain</label><input type="range" id="micGain" min="1" max="16" step="0.5" value="1"><span class="val" id="micGainV">1.0</span></div>
  <div class="row"><label>rms gate</label><input type="range" id="rmsGateSlider" min="0" max="0.1" step="0.002" value="0.012"><span class="val" id="rmsGateV">0.012</span></div>
  <div class="hint">当前 RMS: <span id="rmsVal">0.0000</span> — 低于 gate 的帧不发。</div>
  <div id="micMeter"><div></div></div>
  <h3>server_vad 参数</h3>
  <div class="row"><label>threshold</label><input type="range" id="threshold" min="0.1" max="0.9" step="0.05" value="0.5"><span class="val" id="threshold_v">0.5</span></div>
  <div class="row"><label>silence_ms</label><input type="range" id="silence" min="200" max="6000" step="100" value="800"><span class="val" id="silence_v">800</span></div>
  <div class="row"><label>max_history</label><input type="range" id="hist" min="1" max="50" step="1" value="20"><span class="val" id="hist_v">20</span></div>
  <div class="hint">改完自动发 session.update</div>
</div>

<div class="chat" id="chat"></div>

<div class="inputbar">
  <input id="textInput" placeholder="打字回车发送（或点 🎤 开始 语音对话）" disabled>
  <button id="sendText" disabled>发送</button>
</div>

<script>
const wsUrl = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws';
const IN_SR = 16000, OUT_SR = 24000;
let ws = null, ctx = null, micStream = null, recNode = null, playNode = null;
let micGain = 1.0, micMuted = false, rmsGate = 0.012;
let responding = false, replyBuf = '', replyEl = null, playbackStarted = false;
const playBuf = [];

const $ = id => document.getElementById(id);
const status = s => { $('status').textContent = s; $('dot').classList.toggle('on', s === 'listening' || s === 'speaking'); };
const addMsg = (cls, txt) => {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = txt;
  $('chat').appendChild(d); $('chat').scrollTop = $('chat').scrollHeight; return d;
};
const setReply = el => { $('chat').scrollTop = $('chat').scrollHeight; };

// settings drawer toggle
$('gear').onclick = () => $('drawer').classList.toggle('open');

function buildSession() {
  return { type: 'session.update', session: {
    instructions: $('persona').value || null,
    input_audio_format: 'pcm', output_audio_format: 'pcm',
    turn_detection: { type: 'server_vad', threshold: parseFloat($('threshold').value), silence_duration_ms: parseInt($('silence').value) },
    max_history_turns: parseInt($('hist').value),
  }};
}

async function start() {
  $('start').disabled = true; $('stop').disabled = false; status('启动中');
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }, video: false
  });
  ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: OUT_SR });
  const src = ctx.createMediaStreamSource(micStream);
  const meter = $('micMeter').firstElementChild;
  recNode = ctx.createScriptProcessor(4096, 1, 1);
  recNode.onaudioprocess = e => {
    e.outputBuffer.getChannelData(0).fill(0);
    const in0 = e.inputBuffer.getChannelData(0);
    let s = 0; for (let i = 0; i < in0.length; i++) s += in0[i]*in0[i];
    const r = Math.sqrt(s / in0.length);
    meter.style.width = Math.min(100, r*300)+'%'; $('rmsVal').textContent = r.toFixed(4);
    if (micMuted || !ws || ws.readyState !== 1) return;
    if (r < rmsGate) return;
    const ratio = ctx.sampleRate / IN_SR;
    const outLen = Math.floor(in0.length / ratio);
    const out = new Int16Array(outLen);
    for (let i = 0; i < outLen; i++) {
      const idx = i*ratio, i0 = Math.floor(idx), i1 = Math.min(i0+1, in0.length-1);
      const v = (in0[i0]*(1-idx+i0) + in0[i1]*(idx-i0)) * micGain;
      out[i] = Math.max(-32768, Math.min(32767, v*32767));
    }
    const bytes = new Uint8Array(out.buffer);
    let bin = ''; for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    ws.send(JSON.stringify({ type:'input_audio_buffer.append', audio: btoa(bin) }));
  };
  src.connect(recNode); recNode.connect(ctx.destination);
  playNode = ctx.createScriptProcessor(8192, 0, 1);
  playNode.onaudioprocess = e => {
    const L = e.outputBuffer.getChannelData(0);
    const total = playBuf.reduce((n,c)=>n+c.length,0);
    if (!playbackStarted && total < OUT_SR*0.3) { L.fill(0); return; }
    playbackStarted = true;
    for (let i = 0; i < L.length; i++) L[i] = shiftOne();
  };
  playNode.connect(ctx.destination);
  ws = new WebSocket(wsUrl);
  ws.onopen = () => { status('listening'); ws.send(JSON.stringify(buildSession())); $('textInput').disabled = false; $('sendText').disabled = false; $('muteMic').disabled = false; };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    switch (m.type) {
      case 'session.created': case 'session.updated': break;
      case 'input_audio_buffer.speech_started':
        if (responding) { playBuf.length = 0; playbackStarted = false; } break;
      case 'input_audio_buffer.speech_stopped': break;
      case 'conversation.item.input_audio_transcription.completed':
        addMsg('user', m.transcript); break;
      case 'response.created': responding = true; status('思考中'); break;
      case 'response.audio_transcript.delta':
        if (m.delta) { replyBuf += m.delta; if (!replyEl) { replyEl = addMsg('ai', replyBuf); } else { replyEl.textContent = replyBuf; } $('chat').scrollTop = $('chat').scrollHeight; status('回复中'); }
        break;
      case 'response.audio.delta':
        if (m.delta) { const raw = atob(m.delta); const a = new Uint8Array(raw.length); for (let i=0;i<raw.length;i++) a[i]=raw.charCodeAt(i); const i16 = new Int16Array(a.buffer); const f = new Float32Array(i16.length); for (let i=0;i<i16.length;i++) f[i]=i16[i]/32768; playBuf.push(f); }
        break;
      case 'response.done':
        responding = false; replyBuf = ''; replyEl = null; playbackStarted = false; status('listening'); break;
      case 'error': addMsg('sys', '⚠ ' + (m.error?.message || '')); break;
    }
  };
  ws.onclose = () => { status('已断开'); stop(); };
  ws.onerror = () => status('错误');
}
function stop() {
  $('start').disabled = false; $('stop').disabled = true; $('muteMic').disabled = true;
  $('textInput').disabled = true; $('sendText').disabled = true;
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  if (recNode) { recNode.disconnect(); recNode = null; }
  if (playNode) { playNode.disconnect(); playNode = null; }
  if (micStream) { micStream.getTracks().forEach(t=>t.stop()); micStream = null; }
  if (ctx) { ctx.close(); ctx = null; }
  status('未连接');
}
$('start').onclick = start; $('stop').onclick = stop;
$('muteMic').onclick = () => { micMuted = !micMuted; $('muteMic').textContent = micMuted ? '取消静音' : '静音'; status(micMuted ? '麦克风静音' : 'listening'); };
$('micGain').oninput = e => { micGain = parseFloat(e.target.value); $('micGainV').textContent = micGain.toFixed(1); };
$('rmsGateSlider').oninput = e => { rmsGate = parseFloat(e.target.value); $('rmsGateV').textContent = rmsGate.toFixed(3); };
for (const [id, lab] of [['threshold','threshold_v'],['silence','silence_v'],['hist','hist_v']]) {
  $(id).oninput = e => { $(lab).textContent = e.target.value; };
  $(id).onchange = () => ws && ws.readyState === 1 && ws.send(JSON.stringify(buildSession()));
}
$('persona').onchange = () => ws && ws.readyState === 1 && ws.send(JSON.stringify(buildSession()));

function sendText() {
  const v = $('textInput').value.trim();
  if (!v || !ws || ws.readyState !== 1) return;
  addMsg('user', v);
  ws.send(JSON.stringify({ type:'conversation.item.create', item:{ type:'message', role:'user', content:[{type:'input_text',text:v}] } }));
  ws.send(JSON.stringify({ type:'response.create' }));
  $('textInput').value = '';
}
$('sendText').onclick = sendText;
$('textInput').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } };

function shiftOne() {
  while (playBuf.length && playBuf[0].length === 0) playBuf.shift();
  if (!playBuf.length) return 0;
  const c = playBuf[0]; const v = c[0];
  if (c.length > 1) playBuf[0] = c.subarray(1); else playBuf.shift();
  return v;
}
</script>
</body>
</html>
